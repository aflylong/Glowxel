<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpongeBob Codex Pet Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #172033;
      --line: #31415f;
      --text: #eef7ff;
      --muted: #9db0c8;
      --accent: #ffe800;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1f3858, var(--bg) 58%);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 540px 1fr;
      gap: 16px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel), transparent 8%);
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
    }

    .card-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .card-head strong {
      display: block;
      font-size: 16px;
    }

    .card-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .stage {
      display: grid;
      place-items: center;
      padding: 18px;
      background: #07111d;
    }

    canvas {
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #50617c;
      background: #000;
    }

    .body {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #1c2a44;
      color: var(--text);
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    button.active {
      border-color: var(--accent);
      color: #111827;
      background: var(--accent);
      font-weight: 800;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .meta div {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #101b2d;
    }

    .meta strong {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .meta span {
      color: var(--accent);
      font-family: Consolas, monospace;
    }

    .desc {
      min-height: 44px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      canvas {
        width: min(82vw, 512px);
        height: min(82vw, 512px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>SpongeBob Codex Pet</h1>
      <p class="subtitle">64x64 离线桌宠状态预览，包含 dance 系列和 fail 状态。</p>
    </header>

    <section class="layout">
      <article class="card">
        <div class="card-head">
          <strong id="stateName">Loading</strong>
          <span id="stateDesc">读取 codex-pet-frames.json...</span>
        </div>
        <div class="stage">
          <canvas id="canvas" width="64" height="64"></canvas>
        </div>
        <div class="body">
          <div class="meta">
            <div><strong>状态</strong><span id="stateId">-</span></div>
            <div><strong>帧数</strong><span id="frameCount">-</span></div>
            <div><strong>速度</strong><span id="frameMs">-</span></div>
          </div>
          <div class="desc" id="behaviorText"></div>
        </div>
      </article>

      <article class="card">
        <div class="card-head">
          <strong>状态列表</strong>
          <span>点击切换预览</span>
        </div>
        <div class="body">
          <div class="grid" id="buttons"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const image = ctx.createImageData(64, 64);
    let data;
    let currentState;
    let frameIndex = 0;
    let timer;

    function hexToRgb(hex) {
      return {
        r: Number.parseInt(hex.slice(1, 3), 16),
        g: Number.parseInt(hex.slice(3, 5), 16),
        b: Number.parseInt(hex.slice(5, 7), 16),
      };
    }

    function drawFrame(frame) {
      for (let i = 0; i < frame.pixels.length; i += 1) {
        const rgb = hexToRgb(frame.pixels[i]);
        const offset = i * 4;
        image.data[offset] = rgb.r;
        image.data[offset + 1] = rgb.g;
        image.data[offset + 2] = rgb.b;
        image.data[offset + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);
    }

    function selectState(stateId) {
      currentState = data.states.find((state) => state.id === stateId);
      frameIndex = 0;
      document.querySelectorAll("button").forEach((button) => {
        button.classList.toggle("active", button.dataset.state === stateId);
      });
      document.getElementById("stateName").textContent = currentState.name;
      document.getElementById("stateDesc").textContent = currentState.description;
      document.getElementById("stateId").textContent = currentState.id;
      document.getElementById("frameCount").textContent = currentState.frameCount;
      document.getElementById("frameMs").textContent = `${currentState.frameMs}ms`;
      document.getElementById("behaviorText").textContent = data.behavior[currentState.id];
      drawFrame(currentState.frames[0]);
      clearInterval(timer);
      timer = setInterval(tick, currentState.frameMs);
    }

    function tick() {
      if (!currentState) {
        return;
      }
      drawFrame(currentState.frames[frameIndex]);
      if (currentState.loops) {
        frameIndex = (frameIndex + 1) % currentState.frames.length;
        return;
      }
      frameIndex = Math.min(frameIndex + 1, currentState.frames.length - 1);
    }

    async function main() {
      const response = await fetch("./codex-pet-frames.json");
      data = await response.json();
      const buttons = document.getElementById("buttons");
      for (const state of data.states) {
        const button = document.createElement("button");
        button.dataset.state = state.id;
        button.textContent = `${state.name} / ${state.id}`;
        button.addEventListener("click", () => selectState(state.id));
        buttons.appendChild(button);
      }
      selectState("idle");
    }

    main().catch((error) => {
      document.getElementById("stateName").textContent = "加载失败";
      document.getElementById("stateDesc").textContent = error.message;
    });
  </script>
</body>
</html>
